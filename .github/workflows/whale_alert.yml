name: Whale Alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: whale-alert
  cancel-in-progress: false

permissions:
  contents: write


jobs:
  run-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python scripts/whale_alert.py
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}

      - name: Save state
        if: always()
        run: |
          git config user.name "whale-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then
            echo "No state changes, skipping commit."
            exit 0
          fi
          git commit -m "Update state [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push rejected, retrying ($i)..."
            sleep 5
          done
